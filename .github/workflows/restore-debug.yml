name: restore-debug
on:
  push:
    branches: ['night/D9']
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: dbg
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -v tests/test_guard_windows.py --basetemp="$env:RUNNER_TEMP\pt"
          $rc = $LASTEXITCODE
          Get-ChildItem "$env:RUNNER_TEMP\pt" -Recurse -Filter connector.log | ForEach-Object { $_.FullName; Get-Content $_.FullName }
          exit $rc
