name: restore-debug
on:
  push:
    branches: ['night/D9']
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: dbg
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\t1\app" "%RUNNER_TEMP%\t1\home"
          echo x> "%RUNNER_TEMP%\t1\app\a.txt"
          robocopy "%RUNNER_TEMP%\t1\nosuch" "%RUNNER_TEMP%\t1\app" /MIR /NFL /NDL /NJH /NJS /NP >nul
          echo robocopy-missing-source errorlevel=%errorlevel%
          robocopy "%RUNNER_TEMP%\t1\nosuch" "%RUNNER_TEMP%\t1\app" /MIR /NFL /NDL /NJH /NJS /NP
          echo with-output errorlevel=%errorlevel%
          mkdir "%RUNNER_TEMP%\t1\empty"
          robocopy "%RUNNER_TEMP%\t1\empty" "%RUNNER_TEMP%\t1\app" /MIR /NFL /NDL /NJH /NJS /NP >nul
          echo empty-source errorlevel=%errorlevel%
