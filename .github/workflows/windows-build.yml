name: windows-build
# Tests (incl. the Windows COM/GC stress) -> PyInstaller (onedir) -> built-exe --selftest -> Inno Setup -> silent install -> --selftest -> mock-hub e2e -> uninstall.
# Tag vX.Y.Z-rcN is a pre-release: only latest-beta.json (release beta-channel), never latest.json.
# Tag vX.Y.Z publishes a GitHub Release (versioned exe, unversioned alias YoussefConnector-Setup.exe, .sha256, latest.json).
# Separate jobs: gitleaks and auto-update. No secrets are used or baked in: the connect code is entered on the user's PC.
on:
  push:
    branches: [master, 'night/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packaging/requirements-win.txt

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (Get-Content VERSION -Raw).Trim() }
          if ($v -notmatch '^\d+\.\d+\.\d+(-rc\d+)?$') { throw "bad version '$v'" }
          [IO.File]::WriteAllText("$PWD\VERSION", "$v`n")
          "APP_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # pre-release tag (v0.1.2-rc1): beta channel only, never latest.json / the unversioned alias / "latest" release
          $pre = if ($v -match '-') { 'true' } else { 'false' }
          "IS_PRERELEASE=$pre" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "NUM_VERSION=$($v.Split('-')[0])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "version $v"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-win.txt

      - name: Tests (core, main, update)
        run: python -m pytest -q -rP   # -rP prints the COM stress verdict (old pattern: survived or crashed)

      - name: "Rollback restore helper (real cmd.exe + robocopy on temp folders; old files back, start line runs, failed restore leaves state untouched)"
        run: python -m pytest -v tests/test_guard_windows.py

      - name: PyInstaller build
        run: python -m PyInstaller packaging/YoussefConnector.spec --noconfirm --distpath dist --workpath build/pyi

      - name: "Selftest (built exe straight from PyInstaller, must finish in 60 s)"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest-built.txt'
          $env:YC_HOME = Join-Path $env:RUNNER_TEMP 'yc-built-home'
          $p = Start-Process -FilePath dist\YoussefConnector\YoussefConnector.exe -ArgumentList '--selftest','--selftest-out',$out -PassThru
          $done = $p.WaitForExit(60000)
          if (-not $done) { $p.Kill(); Write-Host 'selftest still running after 60 s'; }
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'NO SELFTEST OUTPUT' }
          if (Test-Path "$env:YC_HOME\crash.log") { Write-Host '--- crash.log'; Get-Content "$env:YC_HOME\crash.log" -Tail 60 }
          if (-not $done) { throw 'built exe --selftest exceeded 60 s' }
          if ($p.ExitCode -ne 0) { throw "built exe selftest exit code $($p.ExitCode)" }

      - name: "Elevated repair task (built exe --install-repair: SYSTEM task, ACLs, task SD, fake + SYSTEM + standard-user runs, --uninstall-repair)"
        shell: pwsh
        timeout-minutes: 8
        run: |
          $exe = 'dist\YoussefConnector\YoussefConnector.exe'
          $out = Join-Path $env:RUNNER_TEMP 'repair-setup.txt'
          $base = Join-Path $env:ProgramData 'YoussefConnector'
          $dir = Join-Path $base 'repair'
          $ps1 = Join-Path $dir 'repair.ps1'
          $lj = Join-Path $dir 'last.json'
          $users = New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-545'
          $admin = @('S-1-5-18', 'S-1-5-32-544')
          $write = [Security.AccessControl.FileSystemRights]'WriteData, AppendData, WriteExtendedAttributes, WriteAttributes, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership'
          $rx = [Security.AccessControl.FileSystemRights]::ReadAndExecute
          function Setup($flag) {
            $p = Start-Process -FilePath $exe -ArgumentList $flag, '--selftest-out', $out -Wait -PassThru
            if (Test-Path $out) { Get-Content $out } else { Write-Host 'NO SETUP OUTPUT' }
            if ($p.ExitCode -ne 0) { throw "$flag exit code $($p.ExitCode)" }
          }
          function Assert-Acl($path, $protected) {
            $acl = Get-Acl -LiteralPath $path
            $rules = @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
            $rules | ForEach-Object { Write-Host "  $path $($_.IdentityReference) $($_.AccessControlType) $($_.FileSystemRights) inherited=$($_.IsInherited)" }
            if ($protected -and -not $acl.AreAccessRulesProtected) { throw "$path inherits ACEs" }
            $bad = @($rules | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference.Value -notin $admin -and ($_.FileSystemRights -band $write) })
            if ($bad.Count) { throw "$path grants write to $($bad.IdentityReference.Value -join ',')" }
            $ok = @($rules | Where-Object { $_.IdentityReference -eq $users -and $_.AccessControlType -eq 'Allow' -and (($_.FileSystemRights -band $rx) -eq $rx) })
            if (-not $ok.Count) { throw "$path is not readable by Users" }
          }
          function Wait-Newer($since, $what) {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $lj) -and (Get-Item $lj).LastWriteTimeUtc -gt $since) { Start-Sleep 1; return (Get-Content $lj -Raw | ConvertFrom-Json) }
              Start-Sleep 2
            }
            Get-ScheduledTaskInfo -TaskName YoussefRepair | Format-List | Out-Host
            throw "$what wrote no new last.json"
          }

          if (Get-ScheduledTask -TaskName YoussefRepair -ErrorAction SilentlyContinue) { throw 'task exists before install' }
          Setup '--install-repair'
          $t = Get-ScheduledTask -TaskName YoussefRepair
          $trig = @($t.Triggers | Where-Object { $null -ne $_ })
          Write-Host "principal $($t.Principal.UserId) $($t.Principal.LogonType) $($t.Principal.RunLevel); action $($t.Actions[0].Execute) $($t.Actions[0].Arguments); triggers $($trig.Count)"
          if ($t.Principal.UserId -notin @('SYSTEM', 'S-1-5-18') -or "$($t.Principal.RunLevel)" -ne 'Highest') { throw 'task principal is not SYSTEM / Highest' }
          if (@($t.Actions).Count -ne 1 -or $t.Actions[0].Arguments -ne ('-NoProfile -ExecutionPolicy Bypass -File "' + $ps1 + '"') -or $t.Actions[0].Execute -notlike '*\WindowsPowerShell\v1.0\powershell.exe') { throw 'unexpected task action' }
          if ($trig.Count) { throw 'task has triggers' }
          $svc = New-Object -ComObject Schedule.Service; $svc.Connect()
          $sd = $svc.GetFolder('\').GetTask('YoussefRepair').GetSecurityDescriptor(4)
          Write-Host "task sddl $sd"
          $raw = New-Object Security.AccessControl.RawSecurityDescriptor $sd
          if (-not @($raw.DiscretionaryAcl | Where-Object { $_.SecurityIdentifier -eq $users }).Count) { throw 'task SD has no Users ACE' }
          foreach ($a in $raw.DiscretionaryAcl) {
            if ($a.SecurityIdentifier.Value -notin $admin -and "$($a.AceQualifier)" -eq 'AccessAllowed' -and ($a.AccessMask -band 0x500D0006)) { throw "task SD grants write to $($a.SecurityIdentifier)" }
          }
          foreach ($p in @($base, $dir, $ps1)) { Assert-Acl $p $true }

          # FAKE mode, run directly as the (admin) runner: discovery only, nothing restarted, last.json redirected
          $fo = Join-Path $env:RUNNER_TEMP 'repair-fake'
          New-Item -ItemType Directory -Force $fo | Out-Null
          $env:YOUSSEF_REPAIR_FAKE = '1'; $env:YOUSSEF_REPAIR_OUT = $fo
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $ps1
          Write-Host "fake run rc $LASTEXITCODE"
          Remove-Item Env:YOUSSEF_REPAIR_FAKE, Env:YOUSSEF_REPAIR_OUT
          $fj = Get-Content (Join-Path $fo 'last.json') -Raw
          Write-Host $fj
          $j = $fj | ConvertFrom-Json
          if (-not $j.fake -or $j.rc -notin @(0, 2) -or -not $j.time -or @($j.steps).Count -lt 3) { throw 'fake last.json incomplete' }
          if (@($j.steps | Where-Object { "$($_.detail)" -like 'pnputil*' }).Count) { throw 'fake run called pnputil' }
          if (Test-Path $lj) { throw 'fake run wrote into the repair folder' }

          # the real task as SYSTEM (runner has no USB/PCI Bluetooth adapter: rc 2, services restarted when present)
          schtasks.exe /run /tn YoussefRepair | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "schtasks /run rc $LASTEXITCODE" }
          $j = Wait-Newer ([datetime]::MinValue) 'SYSTEM run'
          Get-Content $lj -Raw | Out-Host
          if ($j.fake -or "$($j.user)" -notmatch 'SYSTEM$' -or $null -eq $j.rc) { throw "unexpected SYSTEM last.json (user $($j.user))" }
          Assert-Acl $lj $false

          # a standard user may start it (read + run rights on the task); infra problems with -Credential only warn
          $pw = 'Yc!' + [guid]::NewGuid().ToString('N').Substring(0, 16) + 'a9'
          net user tester $pw /add /y | Out-Null
          try {
            $cred = New-Object PSCredential('tester', (ConvertTo-SecureString $pw -AsPlainText -Force))
            $since = (Get-Item $lj).LastWriteTimeUtc
            $sp = $null
            try { $sp = Start-Process -FilePath "$env:SystemRoot\System32\schtasks.exe" -ArgumentList '/run', '/tn', 'YoussefRepair' -Credential $cred -WorkingDirectory "$env:SystemRoot\System32" -WindowStyle Hidden -Wait -PassThru }
            catch { Write-Host "::warning::standard-user run not possible on this runner: $($_.Exception.Message)" }
            if ($sp) {
              Write-Host "standard user schtasks /run exit $($sp.ExitCode)"
              if ($sp.ExitCode -ne 0) { throw "standard user could not run the task (exit $($sp.ExitCode))" }
              $null = Wait-Newer $since 'standard-user run'
              Write-Host 'standard user started the SYSTEM task'
            }
          } finally { net user tester /delete | Out-Null }

          Setup '--uninstall-repair'
          if (Get-ScheduledTask -TaskName YoussefRepair -ErrorAction SilentlyContinue) { throw 'task still present after --uninstall-repair' }
          if (Test-Path $base) { throw "$base still present after --uninstall-repair" }
          Setup '--uninstall-repair'   # idempotent
          Setup '--install-repair'     # left installed: the Inno uninstaller must remove it (checked in the Uninstall step)
          if (-not (Get-ScheduledTask -TaskName YoussefRepair -ErrorAction SilentlyContinue)) { throw 'reinstall failed' }

      - name: Inno Setup compile
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DNumVersion=$env:NUM_VERSION" packaging\YoussefConnector.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed $LASTEXITCODE" }
          $name = "YoussefConnector-Setup-$env:APP_VERSION.exe"
          $exe = "dist\installer\$name"
          $h = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$h  $name" | Out-File -Encoding ascii "$exe.sha256"
          Copy-Item $exe dist\installer\YoussefConnector-Setup.exe
          "$h  YoussefConnector-Setup.exe" | Out-File -Encoding ascii dist\installer\YoussefConnector-Setup.exe.sha256
          $m = @{ version = $env:APP_VERSION; url = "https://github.com/${{ github.repository }}/releases/download/v$env:APP_VERSION/$name"; sha256 = $h } | ConvertTo-Json -Compress
          # stable -> latest.json; pre-release -> latest-beta.json only (latest.json must never describe a pre-release)
          $mf = if ($env:IS_PRERELEASE -eq 'true') { 'latest-beta.json' } else { 'latest.json' }
          [IO.File]::WriteAllText("$PWD\dist\installer\$mf", $m)
          Write-Host "sha256 $h size $((Get-Item $exe).Length)"

      - name: Silent install
        shell: pwsh
        run: |
          $env:YC_UPDATE_URL = 'http://127.0.0.1:9/none'     # the app that auto-starts must not touch the real releases
          # WaitForExit, not Start-Process -Wait: -Wait also waits for the app the installer starts (nowait child)
          $ip = Start-Process "dist\installer\YoussefConnector-Setup-$env:APP_VERSION.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -PassThru
          $ip.WaitForExit()
          $exe = "$env:LOCALAPPDATA\Programs\YoussefConnector\YoussefConnector.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 40; throw "not installed: $exe" }
          Get-Process YoussefConnector -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "installed $exe"

      - name: "Selftest (installed exe; imports, VAD model, fake audio loop, zero devices)"
        shell: pwsh
        timeout-minutes: 8
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $exe = "$env:LOCALAPPDATA\Programs\YoussefConnector\YoussefConnector.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest','--selftest-out',$out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'NO SELFTEST OUTPUT' }
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }

      - name: "Mock-hub e2e (installed exe: config, status page, core, fake adapters)"
        shell: pwsh
        timeout-minutes: 8
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'e2e.txt'
          $exe = "$env:LOCALAPPDATA\Programs\YoussefConnector\YoussefConnector.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--e2e','--selftest-out',$out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'NO E2E OUTPUT' }
          if ($p.ExitCode -ne 0) { throw "e2e exit code $($p.ExitCode)" }

      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\YoussefConnector"
          $up = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru
          $up.WaitForExit()
          # unins000.exe re-launches itself from temp, and the elevated repair-task removal runs first: poll, not a fixed sleep
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and ((Test-Path "$dir\YoussefConnector.exe") -or (Get-ScheduledTask -TaskName YoussefRepair -ErrorAction SilentlyContinue))) { Start-Sleep 2 }
          Start-Sleep 3
          if (Test-Path "$dir\YoussefConnector.exe") { throw 'uninstall left the exe behind' }
          if (Get-ScheduledTask -TaskName YoussefRepair -ErrorAction SilentlyContinue) { throw 'uninstall left the YoussefRepair task behind' }
          if (Test-Path "$env:ProgramData\YoussefConnector") { throw 'uninstall left ProgramData\YoussefConnector behind' }
          Write-Host 'uninstalled (app, repair task, repair folder)'

      - uses: actions/upload-artifact@v4
        with:
          name: YoussefConnector-${{ env.APP_VERSION }}
          path: |
            dist/installer/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: onedir
          path: dist/YoussefConnector
          retention-days: 1

      - name: GitHub release (tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:IS_PRERELEASE -eq 'true') {
            # pre-release: versioned exe + sha + latest-beta.json only; GitHub's /releases/latest ignores pre-releases
            $files = @("dist\installer\YoussefConnector-Setup-$env:APP_VERSION.exe", "dist\installer\YoussefConnector-Setup-$env:APP_VERSION.exe.sha256")
            gh release view $env:GITHUB_REF_NAME 2>$null
            if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME @files --clobber }
            else { gh release create $env:GITHUB_REF_NAME @files --prerelease --title "Youssef Connector $env:APP_VERSION (beta)" --notes "Pre-release for the beta update channel." }
            if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
            # fixed beta pointer release: https://github.com/<repo>/releases/download/beta-channel/latest-beta.json
            $bf = @("dist\installer\latest-beta.json")
            gh release view beta-channel 2>$null
            if ($LASTEXITCODE -eq 0) { gh release upload beta-channel @bf --clobber }
            else { gh release create beta-channel @bf --prerelease --target ${{ github.sha }} --title "Beta channel pointer" --notes "Holds latest-beta.json for config channel=beta. Not an installer release." }
            if ($LASTEXITCODE -ne 0) { throw 'gh beta-channel release failed' }
          } else {
            $files = @("dist\installer\YoussefConnector-Setup-$env:APP_VERSION.exe", "dist\installer\YoussefConnector-Setup-$env:APP_VERSION.exe.sha256",
                       "dist\installer\YoussefConnector-Setup.exe", "dist\installer\YoussefConnector-Setup.exe.sha256", "dist\installer\latest.json")
            gh release view $env:GITHUB_REF_NAME 2>$null
            if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME @files --clobber }
            else { gh release create $env:GITHUB_REF_NAME @files --title "Youssef Connector $env:APP_VERSION" --notes "Install: https://github.com/${{ github.repository }}/releases/latest/download/YoussefConnector-Setup.exe" }
            if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
          }

  auto-update:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onedir
          path: dist/YoussefConnector
      - name: Inno Setup
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress
      - name: "Auto-update test (0.0.1 -> 0.0.2 over the running app; tampered sha256 rejected)"
        shell: pwsh
        run: ./packaging/ci_update_test.ps1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum verified)
        run: |
          v=8.30.1
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" gl.sums | sed 's# gitleaks_.*# gl.tgz#' | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
